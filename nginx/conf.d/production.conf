map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

resolver 127.0.0.11 valid=1s ipv6=off;

upstream litellm_instances {
    zone litellm_instances 64k;
    least_conn;
    server litellm:4000 resolve;
    keepalive 64;
    keepalive_timeout 4s;
}

upstream analyzer_instances {
    zone analyzer_instances 64k;
    least_conn;
    server presidio-analyzer:5001 resolve;
    keepalive 64;
    keepalive_timeout 4s;
}

server {
    listen 80;
    listen 4000;
    server_name _;
    client_max_body_size 25m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        proxy_pass http://litellm_instances;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 5001;
    client_max_body_size 25m;
    location / {
        proxy_pass http://analyzer_instances;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Analysis has no provider-side effect. Preserve bounded overload refusal.
        proxy_next_upstream error http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}

server {
    listen 2455;
    client_max_body_size 25m;
    location / {
        set $upstream http://codex-lb:2455;
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
