# Local-only compute gateway. Inter-node publication belongs to stage 4.
upstream analyzer_instances {
    zone analyzer_instances 64k;
    least_conn;
    server presidio-analyzer:5001 resolve;
    keepalive 64;
    keepalive_timeout 4s;
}

server {
    listen 80;
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location / {
        return 404;
    }
}

server {
    listen 5001;
    client_max_body_size 25m;
    location / {
        proxy_pass http://analyzer_instances;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1500s;
        proxy_send_timeout 1500s;
        proxy_next_upstream off;
    }
}
