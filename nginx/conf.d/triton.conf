# Shared by functional/production. This listener is never published on the host.
resolver 127.0.0.11 valid=1s ipv6=off;

upstream ner_triton_instances {
    zone ner_triton_instances 64k;
    least_conn;
    server ner-triton:8000 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
    keepalive_timeout 4s;
}

server {
    listen 8000;
    client_max_body_size 1m;

    location /v2/models/tiny2/versions/1/ {
        proxy_pass http://ner_triton_instances;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # Never replay an inference already accepted by a peer. Subsequent
        # requests may use another healthy peer, but not this POST again.
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
