services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    cpus: ${NGINX_CPUS}
    mem_limit: ${NGINX_MEMORY}
    volumes:
      - ./nginx/conf.d/compute.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/triton.conf:/etc/nginx/conf.d/triton.conf:ro
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/nginx-health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      ru-llm-proxy.topology: production
      ru-llm-proxy.node-role: compute
    networks:
      - ru-llm-proxy

  presidio-analyzer:
    extends:
      file: docker-compose.ner.yml
      service: presidio-analyzer
    scale: ${ANALYZER_REPLICAS}
    cpus: ${ANALYZER_CPUS}
    mem_limit: ${ANALYZER_MEMORY}
    environment:
      PRESIDIO_ANALYZER_QUEUE_TIMEOUT_SECONDS: ${PRESIDIO_ANALYZER_QUEUE_TIMEOUT_SECONDS:-45}
    labels:
      ru-llm-proxy.topology: production
      ru-llm-proxy.node-role: compute

  ner-triton:
    extends:
      file: docker-compose.ner.yml
      service: ner-triton
    scale: ${TRITON_REPLICAS}
    cpus: ${TRITON_CPUS}
    mem_limit: ${TRITON_MEMORY}
    environment:
      TRITON_MODEL_INSTANCES: ${TRITON_MODEL_INSTANCES}
    labels:
      ru-llm-proxy.topology: production
      ru-llm-proxy.node-role: compute

networks:
  ru-llm-proxy:
    driver: bridge
