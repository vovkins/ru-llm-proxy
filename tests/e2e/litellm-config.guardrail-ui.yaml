model_list:
  - model_name: mock-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://mock-upstream:8080/v1
      api_key: os.environ/OPENAI_API_KEY
  - model_name: mock-responses
    litellm_params:
      model: openai/mock-responses
      api_base: http://mock-upstream:8080/v1
      api_key: os.environ/OPENAI_API_KEY
guardrails:
  - guardrail_name: test-mask
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: pre_call
      pii_mode: mask
  - guardrail_name: test-block
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: pre_call
      pii_mode: block
  - guardrail_name: test-dictionary
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: pre_call
      pii_mode: mask
      dictionary_substitutions_enabled: true
      dictionary_substitutions_json: >-
        {"substitutions":[{"id":"ui_private_value","source":"ui_private_value","replacement":"NeutralCorp","restore":false}]}
  - guardrail_name: test-post
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: post_call
      default_on: true
  - guardrail_name: test-post-secondary
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: post_call
      default_on: false
general_settings:
  cancel_on_disconnect: true
  master_key: os.environ/LITELLM_MASTER_KEY
  store_prompts_in_spend_logs: os.environ/STORE_PROMPTS_IN_SPEND_LOGS
