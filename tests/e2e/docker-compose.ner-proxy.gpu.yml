services:
  presidio-analyzer:
    environment:
      PRESIDIO_ANALYZER_DEVICE_PROFILE: gpu
      PRESIDIO_ANALYZER_GPU_PRECISION: fp16
      PRESIDIO_ANALYZER_NER_BATCH_SIZE: "8"
      PRESIDIO_ANALYZER_WORKERS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
