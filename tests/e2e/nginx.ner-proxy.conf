# Test-only localhost access; compute containers remain on the internal network.
server {
    listen 5001;
    location / {
        set $backend presidio-analyzer;
        proxy_pass http://$backend:5001$request_uri;
        proxy_read_timeout 180s;
    }
}
server {
    listen 4000;
    location / {
        set $backend litellm-mask;
        proxy_pass http://$backend:4000$request_uri;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
server {
    listen 4001;
    location / {
        set $backend litellm-block;
        proxy_pass http://$backend:4000$request_uri;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
