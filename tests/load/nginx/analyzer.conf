worker_processes auto;

events {
    worker_connections 2048;
}

http {
    access_log off;
    error_log /var/log/nginx/error.log warn;
    resolver 127.0.0.11 valid=1s ipv6=off;

    upstream analyzers {
        zone analyzers 64k;
        least_conn;
        server load-presidio-analyzer:5001 resolve;
        keepalive 64;
        keepalive_timeout 4s;
    }

    server {
        listen 5001;
        client_max_body_size 64m;

        location = /router-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://analyzers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 1300s;
            proxy_read_timeout 1300s;
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
