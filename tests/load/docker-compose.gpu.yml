services:
  load-presidio-analyzer:
    build:
      target: analyzer-gpu
      args:
        PYTORCH_GPU_INDEX_URL: ${PYTORCH_GPU_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    environment:
      PRESIDIO_ANALYZER_DEVICE_PROFILE: gpu
      PRESIDIO_ANALYZER_GPU_PRECISION: fp16
      PRESIDIO_ANALYZER_NER_BATCH_SIZE: "8"
      PRESIDIO_ANALYZER_WORKERS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
