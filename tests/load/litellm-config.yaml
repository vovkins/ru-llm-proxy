model_list:
  - model_name: mock-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://load-mock-upstream:8080/v1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      id: load-mock-provider
      base_model: mock-chat

guardrails:
  - guardrail_name: ru-pii-mask-pre
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: pre_call
      default_on: true
  - guardrail_name: ru-pii-mask-post
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: post_call
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  callbacks:
    - prometheus
  require_auth_for_metrics_endpoint: false
  drop_params: true
