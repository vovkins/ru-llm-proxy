model_list:
  - model_name: mock-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://load-mock-upstream-a:8080/v1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      id: load-mock-a
      base_model: mock-chat
  - model_name: mock-chat
    litellm_params:
      model: openai/mock-chat
      api_base: http://load-mock-upstream-b:8080/v1
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      id: load-mock-b
      base_model: mock-chat
  - model_name: mock-timeout
    litellm_params:
      model: openai/mock-chat
      api_base: http://load-mock-upstream-a:8080/v1
      api_key: os.environ/OPENAI_API_KEY
      timeout: 1
    model_info:
      id: load-mock-timeout
      base_model: mock-timeout

router_settings:
  redis_url: os.environ/REDIS_URL
  routing_strategy: simple-shuffle
  optional_pre_call_checks:
    - deployment_affinity
  deployment_affinity_ttl_seconds: 86400
  num_retries: 0

guardrails:
  - guardrail_name: ru-pii-mask-pre
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: pre_call
      default_on: true
  - guardrail_name: ru-pii-mask-post
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: post_call
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  # Bound cross-replica virtual-key revocation lag in the load contour.
  user_api_key_cache_ttl: 5

litellm_settings:
  callbacks:
    - prometheus
  require_auth_for_metrics_endpoint: false
  drop_params: true
