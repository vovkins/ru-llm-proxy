model_list:
  - model_name: GLM-5.1-AWQ
    litellm_params:
      model: hosted_vllm/GLM-5.1-AWQ
      api_base: os.environ/GLM_LLM_ENDPOINT
      api_key: os.environ/GLM_LLM_AUTH_TOKEN
      max_tokens: 4096
    model_info:
      id: glm-5-1-awq-compare
      base_model: GLM-5.1-AWQ
      access_groups: ["compare"]

router_settings:
  redis_url: os.environ/REDIS_URL
  routing_strategy: simple-shuffle
  optional_pre_call_checks:
    - deployment_affinity
  deployment_affinity_ttl_seconds: 86400
  num_retries: 3
  timeout: 60

guardrails:
  - guardrail_name: "ru-pii-mask-pre"
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: "pre_call"
      default_on: true
  - guardrail_name: "ru-pii-mask-post"
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: "post_call"
      default_on: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  callbacks:
    - prometheus
  drop_params: true
