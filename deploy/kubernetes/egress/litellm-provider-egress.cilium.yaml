apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ru-llm-proxy-litellm-provider-egress
  namespace: ru-llm-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  egress:
    - toFQDNs:
        - matchName: api.z.ai
        - matchName: api.openai.com
        - matchName: api.anthropic.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
