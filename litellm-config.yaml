model_list:
  # Default public GLM profile. Both deployments use Z.AI Coding Plan keys
  # and are exposed to clients as one model group: glm-5.2.
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
    model_info:
      id: glm-5-2-zai-coding-primary
      base_model: glm-5.2
      access_groups: ["zai", "standard"]
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY_2
    model_info:
      id: glm-5-2-zai-coding-secondary
      base_model: glm-5.2
      access_groups: ["zai", "standard"]

  # Additional public GLM alias for installations that still need GLM-5.1.
  - model_name: glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY
    model_info:
      id: glm-5-1-zai-coding-primary
      base_model: glm-5.1
      access_groups: ["zai", "standard"]
  - model_name: glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: https://api.z.ai/api/coding/paas/v4
      api_key: os.environ/ZAI_API_KEY_2
    model_info:
      id: glm-5-1-zai-coding-secondary
      base_model: glm-5.1
      access_groups: ["zai", "standard"]

router_settings:
  redis_url: os.environ/REDIS_URL
  routing_strategy: simple-shuffle
  optional_pre_call_checks:
    - deployment_affinity
  deployment_affinity_ttl_seconds: 86400
  num_retries: 3
  timeout: 60

guardrails:
  - guardrail_name: "ru-pii-mask-pre"
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: "pre_call"
      default_on: true
    guardrail_info:
      description: "Masks Russian PII before the provider request. Returned by GET /guardrails/list for API consumers; LiteLLM UI may show only the guardrail name."
      params:
        - name: "stage"
          type: "string"
          description: "pre_call; masks Russian PII before the provider request."
        - name: "entities"
          type: "list[string]"
          description: "PHONE_NUMBER, EMAIL_ADDRESS, RU_INN, RU_SNILS, RU_PASSPORT, CREDIT_CARD, RU_ADDRESS, PERSON, LOCATION, ORGANIZATION."
        - name: "mapping_store"
          type: "string"
          description: "Redis key pii_mapping:<pii_request_id> with server-generated mapping id and TTL from PII_MAPPING_TTL_SECONDS."
        - name: "policy_mode"
          type: "string"
          description: "PII_GUARDRAIL_MODE: mask preserves reversible masking, block rejects detected PII before provider calls."
        - name: "dictionary_substitutions"
          type: "string"
          description: "DICTIONARY_SUBSTITUTIONS_ENABLED: true by default; applies reversible exact business-term replacements from dictionary-substitutions.default.json or DICTIONARY_SUBSTITUTIONS_JSON before Presidio analysis."
        - name: "synthetic_pii_allowlist_mode"
          type: "string"
          description: "SYNTHETIC_PII_ALLOWLIST_MODE: off by default; allow removes explicitly configured synthetic/test PII spans from Presidio results before mask/block handling."
        - name: "synthetic_pii_allowlist_rules"
          type: "string"
          description: "SYNTHETIC_PII_ALLOWLIST_JSON: optional PII-only rules with rule_id, entity_types, exact values, and anchored safe synthetic regex patterns. Matches are logged and counted without raw values."
        - name: "regulated_topic_policy_mode"
          type: "string"
          description: "REGULATED_TOPIC_POLICY_MODE: off by default; block rejects high-confidence regulated AML/CFT, sanctions-screening, transaction-monitoring, suspicious-activity, and compliance-bypass topics before Presidio analysis and provider calls."
        - name: "regulated_topic_policy_extra_rules"
          type: "string"
          description: "REGULATED_TOPIC_POLICY_EXTRA_RULES_JSON: optional operator-defined block-only regex rules with bounded category, rule_id, action, pattern, and flags fields."
        - name: "pre_egress_policy_mode"
          type: "string"
          description: "PRE_EGRESS_POLICY_MODE: block rejects high-confidence config/log operational payloads before Presidio analysis and provider calls; off disables this classifier."
        - name: "final_payload_leak_check_mode"
          type: "string"
          description: "FINAL_PAYLOAD_LEAK_CHECK_MODE: block rejects configured canaries and high-confidence raw leak markers after request mutation and before provider calls, including provider-bound request containers (messages/input/instructions/system), tools/tool_choice, legacy functions/function_call, prediction, response_format, text, extra_body, stop/stop_sequences, prompt_cache_key, safety_identifier, web_search_options, user, and provider metadata; off disables this final check."
        - name: "request_fields"
          type: "list[string]"
          description: "Masks message.content, Anthropic Messages system and tool_result.content, Responses API instructions/input string/list text items, tool-call arguments, tool-output output string/list text items, text content blocks, tool_calls[].function.arguments, and function_call.arguments."
  - guardrail_name: "ru-pii-mask-post"
    litellm_params:
      guardrail: litellm_guardrails.pii_guardrail.RuPIIGuardrail
      mode: "post_call"
      default_on: true
    guardrail_info:
      description: "Restores request-scoped placeholders in model responses. Returned by GET /guardrails/list for API consumers; LiteLLM UI may show only the guardrail name."
      params:
        - name: "stage"
          type: "string"
          description: "post_call; restores request-scoped placeholders in model responses."
        - name: "response_fields"
          type: "list[string]"
          description: "Non-streaming: content, reasoning_content, response content blocks, tool_calls[].function.arguments, and function_call.arguments. Streaming: delta.content and delta.reasoning_content."
        - name: "streaming"
          type: "string"
          description: "async_post_call_streaming_iterator_hook restores placeholders across chunk boundaries and deletes Redis mapping when the stream ends."
        - name: "mapping_cleanup"
          type: "string"
          description: "Deletes Redis pii_mapping:<pii_request_id> after successful post-call or streaming iterator processing."

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  callbacks:
    - prometheus
  require_auth_for_metrics_endpoint: false
  drop_params: true
