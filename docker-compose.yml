services:
  # === Nginx (reverse proxy / single public entry point) ===
  nginx:
    image: nginx:1.27-alpine
    container_name: ru-llm-proxy-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      litellm:
        condition: service_healthy
    healthcheck:
      # proxies through to litellm, so this checks both nginx and upstream
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/liveliness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ru-llm-proxy

  # === LiteLLM Proxy ===
  litellm:
    # thin image over the official one: bakes the proxy CA into certifi so the aiohttp
    # transport trusts the re-signing proxy (it ignores SSL_VERIFY/SSL_CERT_FILE)
    build:
      context: .
      dockerfile: litellm/Dockerfile
    container_name: ru-llm-proxy
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./litellm_guardrails:/app/litellm_guardrails:ro
    environment:
      # --- Air-gapped: outbound proxy (empty = direct egress) ---
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      # lowercase duplicates so every HTTP client (httpx/requests/aiohttp) honors the proxy
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
      # Outbound TLS trust for a re-signing corporate proxy is baked into the image's certifi
      # bundle (see litellm/Dockerfile) — no runtime CA mount and no SSL_VERIFY=False needed.
      # Without a CA the image keeps stock certifi, so this also works on the open internet.
      # LiteLLM's default aiohttp transport verifies against certifi and ignores SSL_VERIFY/
      # SSL_CERT_FILE, so we force the httpx transport (which also uses certifi) for consistency.
      - DISABLE_AIOHTTP_TRANSPORT=True
      # make the HTTP clients read the *_PROXY env vars above
      - AIOHTTP_TRUST_ENV=True
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - UI_USERNAME=${UI_USERNAME}
      - UI_PASSWORD=${UI_PASSWORD}
      - DISABLE_ADMIN_UI=${DISABLE_ADMIN_UI:-False}
      - DATABASE_URL=${LITELLM_DB_URL}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - ZAI_API_KEY_2=${ZAI_API_KEY_2:-}
      - JWT_PUBLIC_KEY_URL=${JWT_PUBLIC_KEY_URL:-}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-}
      - PRESIDIO_ANALYZER_URL=${PRESIDIO_ANALYZER_URL:-http://presidio-analyzer:5001}
      - PII_GUARDRAIL_MODE=${PII_GUARDRAIL_MODE:-mask}
      - DICTIONARY_SUBSTITUTIONS_ENABLED=${DICTIONARY_SUBSTITUTIONS_ENABLED:-true}
      - DICTIONARY_SUBSTITUTIONS_FILE=${DICTIONARY_SUBSTITUTIONS_FILE:-/app/litellm_guardrails/dictionary-substitutions.default.json}
      - DICTIONARY_SUBSTITUTIONS_JSON=${DICTIONARY_SUBSTITUTIONS_JSON:-}
      - DICTIONARY_SUBSTITUTIONS_FAILURE_MODE=${DICTIONARY_SUBSTITUTIONS_FAILURE_MODE:-fail_closed}
      - SYNTHETIC_PII_ALLOWLIST_MODE=${SYNTHETIC_PII_ALLOWLIST_MODE:-off}
      - SYNTHETIC_PII_ALLOWLIST_JSON=${SYNTHETIC_PII_ALLOWLIST_JSON:-[]}
      - REGULATED_TOPIC_POLICY_MODE=${REGULATED_TOPIC_POLICY_MODE:-off}
      - REGULATED_TOPIC_POLICY_EXTRA_RULES_JSON=${REGULATED_TOPIC_POLICY_EXTRA_RULES_JSON:-}
      - PRE_EGRESS_POLICY_MODE=${PRE_EGRESS_POLICY_MODE:-block}
      - FINAL_PAYLOAD_LEAK_CHECK_MODE=${FINAL_PAYLOAD_LEAK_CHECK_MODE:-block}
      - FINAL_PAYLOAD_LEAK_CHECK_CANARIES=${FINAL_PAYLOAD_LEAK_CHECK_CANARIES:-}
      - PII_GUARDRAIL_FAILURE_MODE=${PII_GUARDRAIL_FAILURE_MODE:-fail_closed}
      - PII_MAPPING_TTL_SECONDS=${PII_MAPPING_TTL_SECONDS:-3600}
      - PII_GUARDRAIL_REDIS_MAX_CONNECTIONS=${PII_GUARDRAIL_REDIS_MAX_CONNECTIONS:-20}
      - PII_GUARDRAIL_REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS=${PII_GUARDRAIL_REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS:-1.0}
      - PII_GUARDRAIL_REDIS_SOCKET_TIMEOUT_SECONDS=${PII_GUARDRAIL_REDIS_SOCKET_TIMEOUT_SECONDS:-2.0}
      - PII_GUARDRAIL_ANALYZER_TIMEOUT_SECONDS=${PII_GUARDRAIL_ANALYZER_TIMEOUT_SECONDS:-30.0}
      - PII_GUARDRAIL_ANALYZER_CONNECT_TIMEOUT_SECONDS=${PII_GUARDRAIL_ANALYZER_CONNECT_TIMEOUT_SECONDS:-5.0}
      - PII_GUARDRAIL_ANALYZER_MAX_CONNECTIONS=${PII_GUARDRAIL_ANALYZER_MAX_CONNECTIONS:-20}
      - PII_GUARDRAIL_ANALYZER_MAX_KEEPALIVE_CONNECTIONS=${PII_GUARDRAIL_ANALYZER_MAX_KEEPALIVE_CONNECTIONS:-10}
      # Tell LiteLLM to find our guardrail module
      - PYTHONPATH=/app
      - STORE_MODEL_IN_DB=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      presidio-analyzer:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ru-llm-proxy

  # === Presidio Analyzer ===
  presidio-analyzer:
    build:
      # repo root so the Dockerfile can COPY the shared certs/proxy-ca.crt into the trust store
      context: .
      dockerfile: presidio/Dockerfile
      target: analyzer
      args:
        # Air-gapped: the image build runs apt/pip/spaCy/DeepPavlov downloads through the
        # corporate proxy and internal PyPI mirror. docker build does NOT inherit the service
        # `environment:` — only build args — so the proxy/mirror settings are forwarded here.
        # All empty by default, so an open-internet build works unchanged.
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_PROXY: ${PIP_PROXY:-}
        DEEPPAVLOV_NER_MODEL_URL: ${DEEPPAVLOV_NER_MODEL_URL:-http://files.deeppavlov.ai/v1/ner/ner_rus_bert_torch_new.tar.gz}
        DEEPPAVLOV_NER_MODEL_SHA256: ${DEEPPAVLOV_NER_MODEL_SHA256:-}
        DEEPPAVLOV_NER_DOWNLOAD_TIMEOUT_SECONDS: ${DEEPPAVLOV_NER_DOWNLOAD_TIMEOUT_SECONDS:-120}
        # Dedicated proxy just for the DeepPavlov archive download (empty = use the generic proxy).
        DEEPPAVLOV_NER_MODEL_PROXY: ${DEEPPAVLOV_NER_MODEL_PROXY:-}
    container_name: presidio-analyzer
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # --- Air-gapped: outbound proxy (empty = direct egress) ---
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      # lowercase duplicates so every HTTP client (requests/urllib3/httpx) honors the proxy
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-}
      # the proxy CA is baked into the image trust store (see presidio/Dockerfile), so the
      # runtime HuggingFace download verifies against it — no TLS bypass, no CA mount needed
      # put the HuggingFace cache on a known path so the bind mount below persists it
      - HF_HOME=/opt/hf-cache
      # hf_xet (Rust/reqwest) is uninstalled in the image; force the plain HTTPS path, which
      # honors the proxy CA via certifi / SSL_CERT_FILE
      - HF_HUB_DISABLE_XET=1
      - PRESIDIO_ANALYZER_WORKERS=${PRESIDIO_ANALYZER_WORKERS:-1}
      - PRESIDIO_ANALYZER_CONCURRENCY_LIMIT=${PRESIDIO_ANALYZER_CONCURRENCY_LIMIT:-1}
      - PRESIDIO_ANALYZER_QUEUE_LIMIT=${PRESIDIO_ANALYZER_QUEUE_LIMIT:-8}
      - PRESIDIO_ANALYZER_QUEUE_TIMEOUT_SECONDS=${PRESIDIO_ANALYZER_QUEUE_TIMEOUT_SECONDS:-0.25}
      - PRESIDIO_ANALYZER_DETECT_BARE_INN_BY_CHECKSUM=${PRESIDIO_ANALYZER_DETECT_BARE_INN_BY_CHECKSUM:-true}
      - PRESIDIO_ANALYZER_INTERNAL_DOMAIN_SUFFIXES=${PRESIDIO_ANALYZER_INTERNAL_DOMAIN_SUFFIXES:-internal,local,lan,corp,corp.local,cluster.local,svc.cluster.local}
      - PRESIDIO_ANALYZER_DETECT_PUBLIC_IPS=${PRESIDIO_ANALYZER_DETECT_PUBLIC_IPS:-false}
      - DEEPPAVLOV_NER_REQUIRED=${DEEPPAVLOV_NER_REQUIRED:-true}
    volumes:
      # persist the HuggingFace cache (rubert ~700 MB) so it's downloaded once,
      # not on every container recreate — this is what speeds up startup
      - ./cache/presidio/huggingface:/opt/hf-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ru-llm-proxy

  # === PostgreSQL ===
  db:
    image: postgres:16-alpine
    container_name: ru-llm-proxy-db
    restart: unless-stopped
    environment:
      # Postgres has no outbound internet dependency, so it gets no proxy env.
      - POSTGRES_USER=${POSTGRES_USER:-litellm}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-litellm}
    volumes:
      # host bind mount keeps DB state visible/backup-able on the air-gapped host
      # (./pgdata is gitignored). Switch to a named volume if you hit host uid/permission issues.
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ru-llm-proxy

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: ru-llm-proxy-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ru-llm-proxy

  # === Test runner for LiteLLM guardrail unit tests ===
  guardrail-tests:
    build:
      context: .
      dockerfile: tests/Dockerfile.guardrails
    profiles:
      - test
    working_dir: /workspace
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - PYTHONPATH=/workspace
      - PYTHONDONTWRITEBYTECODE=1
      - PRESIDIO_ANALYZER_URL=http://presidio-analyzer:5001
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/workspace:ro
    networks:
      - ru-llm-proxy

  # === Analyzer API recognizer regression tests (lightweight, no NER model) ===
  presidio-analyzer-tests:
    build:
      # repo root to match the presidio-analyzer image context (shared certs/proxy-ca.crt)
      context: .
      dockerfile: presidio/Dockerfile
      target: analyzer-test
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        no_proxy: ${NO_PROXY:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        PIP_PROXY: ${PIP_PROXY:-}
    profiles:
      - test
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace:/workspace/presidio
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - .:/workspace:ro
    networks:
      - ru-llm-proxy

networks:
  ru-llm-proxy:
    driver: bridge
