services:
  nginx:
    ports:
      - "${CODEX_LB_PORT:-2455}:2455"
    depends_on:
      codex-lb:
        condition: service_healthy
    networks:
      - ru-llm-proxy
      - codex-lb-proxy

  litellm:
    volumes:
      - ./litellm-config.codex-lb.yaml:/app/config.yaml:ro
    environment:
      - CODEX_LB_API_KEY=${CODEX_LB_API_KEY:?Set CODEX_LB_API_KEY}
    depends_on:
      codex-lb:
        condition: service_healthy
    networks:
      - ru-llm-proxy
      - codex-lb-proxy

  codex-lb:
    # Thin corporate-CA layer over the pinned official multi-arch image.
    build:
      context: .
      dockerfile: codex-lb/Dockerfile
    container_name: ru-llm-proxy-codex-lb
    restart: unless-stopped
    ports:
      - "${CODEX_LB_METRICS_PORT:-9090}:9090"
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,db,redis,presidio-analyzer,litellm,nginx,codex-lb,codex-lb-db}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,db,redis,presidio-analyzer,litellm,nginx,codex-lb,codex-lb-db}
      CODEX_LB_DATA_DIR: /var/lib/codex-lb
      CODEX_LB_DATABASE_URL: "postgresql+asyncpg://codex_lb:${CODEX_LB_POSTGRES_PASSWORD:?Set CODEX_LB_POSTGRES_PASSWORD}@codex-lb-db:5432/codex_lb"
      CODEX_LB_DASHBOARD_AUTH_MODE: standard
      CODEX_LB_METRICS_ENABLED: "true"
      CODEX_LB_TELEMETRY_ENABLED: "false"
    volumes:
      - codex-lb-data:/var/lib/codex-lb
    depends_on:
      codex-lb-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:2455/health/ready', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codex-lb-proxy
      - codex-lb-database

  codex-lb-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: ru-llm-proxy-codex-lb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: codex_lb
      POSTGRES_PASSWORD: ${CODEX_LB_POSTGRES_PASSWORD:?Set CODEX_LB_POSTGRES_PASSWORD}
      POSTGRES_DB: codex_lb
    volumes:
      - codex-lb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U codex_lb -d codex_lb
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - codex-lb-database

volumes:
  codex-lb-data:
  codex-lb-pgdata:

networks:
  codex-lb-proxy:
    driver: bridge
  codex-lb-database:
    driver: bridge
    internal: true
